<!doctype html>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23087a52'/%3E%3Ctext x='50' y='68' font-family='Arial' font-weight='900' font-size='60' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#087a52;--green-2:#0b9b69;--green-soft:#e9f8f2;--red:#e43d30;--ink:#12211b;--muted:#64736d;--bg:#f5f8f7;--card:#fff;--line:#e2e9e6;--radius:18px;--header:72px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%;-webkit-text-size-adjust:100%}
body{font-family:Hind,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:hidden;max-width:100vw;min-height:100vh}
body.menu-open{overflow:hidden}
button,a{font:inherit}button{border:0;cursor:pointer;background:none;color:inherit}a{color:inherit}
img,svg{max-width:100%;height:auto;display:block}
:focus-visible{outline:3px solid var(--green-2);outline-offset:3px;border-radius:8px}
.container{width:100%;max-width:1240px;margin-inline:auto;padding-inline:clamp(14px,4vw,24px)}
.skip-link{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--green);color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:700}
.skip-link:focus{left:12px}
.header{position:sticky;top:0;z-index:1000;height:var(--header);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 4px 24px rgba(0,0,0,.05)}
.header-inner{height:100%;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto;min-width:0}
.brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font:900 22px Outfit,sans-serif;background:linear-gradient(135deg,var(--green),var(--green-2));box-shadow:0 8px 22px rgba(8,122,82,.25);flex-shrink:0}
.brand-name{font:900 24px/1 Outfit,sans-serif;letter-spacing:.2px;white-space:nowrap;color:var(--ink)}
.brand-name span{color:var(--green)}
.nav{margin-left:auto;min-width:0}
.nav-list{display:flex;align-items:center;gap:3px;list-style:none;margin:0;padding:0}
.nav-link{display:flex;align-items:center;gap:5px;text-decoration:none;font-weight:700;color:#31413a;padding:10px 12px;border-radius:11px;white-space:nowrap;transition:.2s}
.nav-link:hover,.nav-link.active{background:var(--green-soft);color:var(--green)}
.menu-btn{display:none;margin-left:auto;width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;font-size:22px;flex-shrink:0;place-items:center}
.hero{background:linear-gradient(135deg,#f8fffc 0%,#eef9f5 48%,#fff7ef 100%);border-bottom:1px solid var(--line);overflow:hidden}
.hero-inner{padding:70px 0 64px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;background:var(--green-soft);color:var(--green);font-weight:800;font-size:14px}
.hero h1{max-width:900px;margin:17px auto 12px;font:900 clamp(28px,6vw,58px)/1.1 Outfit,sans-serif;letter-spacing:-.8px;color:var(--ink)}
.hero h1 span{color:var(--green)}
.hero p{max-width:700px;margin:auto;color:var(--muted);font-size:clamp(15px,2vw,17px)}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 20px;border-radius:999px;text-decoration:none;font-weight:800;transition:.2s var(--ease);max-width:100%}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 9px 22px rgba(8,122,82,.22)}
.btn-primary:hover{background:#066a48;transform:translateY(-2px)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px)}
.trust{padding:18px 0;background:#0d2019;color:#e8f4ef;overflow:hidden}
.trust-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.trust-item strong{display:block;font:800 16px Outfit,sans-serif}
.trust-item span{font-size:12px;color:#aac0b7}
.section{padding:58px 0;overflow:hidden}
.section.alt{background:#fff;border-block:1px solid var(--line)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.section-title{font:900 clamp(22px,4vw,31px)/1.15 Outfit,sans-serif;color:var(--ink)}
.section-sub{color:var(--muted);font-size:14px;margin-top:3px}
.see-all{color:var(--green);font-weight:800;text-decoration:none;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid.tools{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:21px;box-shadow:0 3px 12px rgba(0,0,0,.025);transition:.25s var(--ease);min-width:0;overflow:hidden;text-decoration:none;color:inherit;display:block}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 35px rgba(16,55,42,.08);border-color:#cce7dc}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.card h3{font:800 19px/1.3 Outfit,sans-serif;word-wrap:break-word;color:var(--ink)}
.card p{color:var(--muted);font-size:14px;margin:8px 0 15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{color:var(--muted);font-size:12px;margin:8px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font:800 10px Outfit,sans-serif;padding:4px 8px;border-radius:99px;color:#fff;white-space:nowrap;flex-shrink:0}
.tag.new{background:#129663}.tag.hot{background:#e43d30}
.card-link{color:var(--green);font-weight:800;font-size:14px}
.tool-icon{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:var(--green-soft);font-size:24px;margin-bottom:12px}
.tool strong{font:800 17px Outfit,sans-serif;display:block;color:var(--ink)}
.tool small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap}
.breadcrumb a{color:var(--green);text-decoration:none;font-weight:700}
.breadcrumb a:hover{text-decoration:underline}
.article-wrap{max-width:820px;margin:0 auto;padding:34px 0 60px}
.article-title{font:900 clamp(26px,5vw,42px)/1.15 Outfit,sans-serif;margin-bottom:12px;letter-spacing:-.5px;color:var(--ink)}
.article-meta{display:flex;gap:14px;color:var(--muted);font-size:13px;margin-bottom:26px;flex-wrap:wrap;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.article-meta .cat{background:var(--green-soft);color:var(--green);padding:4px 12px;border-radius:99px;font-weight:800;font-size:12px}
.article-body{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,4vw,38px);box-shadow:0 3px 12px rgba(0,0,0,.025);line-height:1.8;font-size:16px;color:var(--ink)}
.article-body p{margin:0 0 16px}
.article-body h2{font:900 clamp(20px,3vw,26px)/1.3 Outfit,sans-serif;color:var(--green);margin:32px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--green-soft)}
.article-body h3{font:800 19px/1.3 Outfit,sans-serif;margin:24px 0 10px;color:var(--ink)}
.article-body ul,.article-body ol{margin:0 0 18px;padding-left:24px}
.article-body li{margin-bottom:8px}
.article-body a{color:var(--green);font-weight:700;text-decoration:none;border-bottom:1px dashed var(--green);word-break:break-word}
.article-body a:hover{border-bottom-style:solid}
.article-body b,.article-body strong{color:var(--ink);font-weight:800}
.article-body table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px;border-radius:10px;overflow:hidden}
.article-body th,.article-body td{border:1px solid var(--line);padding:11px 13px;text-align:left;vertical-align:top}
.article-body th{background:var(--green-soft);font-weight:800;color:var(--green)}
.article-body input,.article-body select,.article-body textarea{font-family:inherit}
.share-row{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);align-items:center}
.share-row strong{font:800 14px Outfit,sans-serif;color:var(--ink);margin-right:6px}
.share-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#fff;text-decoration:none;transition:transform .2s;font-weight:800;font-size:11px;border:0;cursor:pointer}
.share-btn:hover{transform:scale(1.1)}
.share-btn.wa{background:#25D366}.share-btn.tg{background:#229ED9}.share-btn.fb{background:#1877F2}.share-btn.tw{background:#000}.share-btn.cp{background:var(--ink)}
.loading,.empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}
.footer{background:#0b1713;color:#b9c8c2;padding:48px 0 20px;padding-bottom:max(20px,env(safe-area-inset-bottom));overflow:hidden}
.footer-grid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:30px}
.footer h3,.footer h4{color:#fff;font-family:Outfit,sans-serif}
.footer h3{font-size:22px}.footer h4{font-size:15px;margin-bottom:12px}
.footer p{font-size:13px;max-width:360px;margin-top:8px}
.footer ul{list-style:none}
.footer li{margin:6px 0}
.footer a{text-decoration:none;color:#b9c8c2;font-size:13px}
.footer a:hover{color:#fff}
.footer-bottom{border-top:1px solid #23342e;margin-top:30px;padding-top:18px;text-align:center;font-size:12px}
.social-float{position:fixed;top:50%;z-index:900;display:flex;flex-direction:column;gap:14px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s var(--ease),visibility .35s,transform .35s var(--ease)}
.social-float.left{left:max(12px,env(safe-area-inset-left));transform:translateY(-50%) scale(.85)}
.social-float.right{right:max(12px,env(safe-area-inset-right));transform:translateY(-50%) scale(.85)}
.social-float.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(-50%) scale(1)}
.social-btn{position:relative;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;color:#fff;text-decoration:none;box-shadow:0 10px 28px rgba(0,0,0,.18);transition:transform .25s var(--ease),box-shadow .25s;animation:socialFloat 3s ease-in-out infinite}
.social-btn svg{display:block}
.social-btn:hover{transform:scale(1.12);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.social-btn.whatsapp{background:#25D366}
.social-btn.telegram{background:#229ED9}
@keyframes socialFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.back-to-top{position:fixed;bottom:80px;right:20px;width:46px;height:46px;background:var(--green);color:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 28px rgba(8,122,82,.35);z-index:800;opacity:0;visibility:hidden;transition:.3s;font-size:20px;cursor:pointer;border:0}
.back-to-top.show{opacity:1;visibility:visible}
.back-to-top:hover{transform:translateY(-3px)}
@media(max-width:1080px){
  .menu-btn{display:grid}
  .nav{position:fixed;top:var(--header);left:0;right:0;bottom:0;background:#fff;overflow-y:auto;padding:10px 16px 35px;transform:translateX(100%);transition:transform .28s var(--ease);visibility:hidden;z-index:999}
  .nav.active{transform:none;visibility:visible}
  .nav-list{display:block}
  .nav-link{width:100%;padding:15px 8px;font-size:16px;border-radius:0;border-bottom:1px solid var(--line)}
}
@media(max-width:820px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.tools{grid-template-columns:repeat(2,minmax(0,1fr))}
  .footer-grid{grid-template-columns:repeat(2,1fr)}
  .hero-inner{padding:55px 0 48px}
}
@media(max-width:560px){
  .brand-name{font-size:20px}.brand-mark{width:38px;height:38px;font-size:20px}
  .grid,.grid.tools{grid-template-columns:1fr}
  .section{padding:44px 0}
  .hero h1{font-size:clamp(26px,7vw,34px)}
  .trust-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr;gap:24px}
  .actions{flex-direction:column;align-items:stretch}
  .btn{width:100%}
  .social-float{top:auto;bottom:max(16px,env(safe-area-inset-bottom));flex-direction:row}
  .social-float.left{left:max(12px,env(safe-area-inset-left));transform:translateY(30px)}
  .social-float.right{right:max(12px,env(safe-area-inset-right));transform:translateY(30px)}
  .social-float.show{transform:translateY(0)}
  .social-btn{width:48px;height:48px}
  .social-btn svg{width:24px;height:24px}
  .article-body{padding:20px 16px;font-size:15px}
  .article-body h2{font-size:20px;margin-top:26px}
  .back-to-top{bottom:80px;right:14px;width:42px;height:42px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

<script>
(function(){
  "use strict";
  var BASE = "/Sarkari_info";
  var CATS = { job:{label:"Jobs",emoji:"💼",path:"jobs"}, yojana:{label:"Yojana",emoji:"🌸",path:"yojana"}, news:{label:"News",emoji:"📰",path:"news"}, tool:{label:"Tools",emoji:"🛠️",path:"tools"} };
  var PATH2TYPE = { jobs:"job", yojana:"yojana", news:"news", tools:"tool" };
  var HOME_LIMIT = { job: 3, yojana: 3, news: 3, tool: 4 };
  var $ = function(s){return document.querySelector(s);};
  var esc = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
  var fmtDate = function(d){var dt=new Date(d);return isNaN(dt)?d:dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});};
  var sortByDate = function(arr){return arr.slice().sort(function(a,b){return new Date(b.date||0)-new Date(a.date||0);});};

  /* ✅ Tool scripts execute karne ke liye */
  var injectContent = function(el, html){
    el.innerHTML = html;
    var scripts = el.querySelectorAll("script");
    Array.prototype.forEach.call(scripts, function(oldScript){
      var newScript = document.createElement("script");
      Array.prototype.forEach.call(oldScript.attributes, function(attr){
        newScript.setAttribute(attr.name, attr.value);
      });
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  };

  var DATA = null;
  var loadData = function(){
    if (DATA) return Promise.resolve(DATA);
    return fetch(BASE + "/data.json").then(function(r){return r.json();}).then(function(j){DATA = Array.isArray(j.articles) ? j.articles : [];return DATA;}).catch(function(e){console.warn(e);DATA=[];return DATA;});
  };

  var renderNav = function(active){
    var links = [
      { type:"home", label:"🏠 Home", href: BASE + "/" },
      { type:"job", label:"💼 Jobs", href: BASE + "/jobs/" },
      { type:"yojana", label:"🌸 Yojana", href: BASE + "/yojana/" },
      { type:"news", label:"📰 News", href: BASE + "/news/" },
      { type:"tool", label:"🛠️ Tools", href: BASE + "/tools/" }
    ];
    $("#navList").innerHTML = links.map(function(l){return '<li><a class="nav-link'+(l.type===active?' active':'')+'" href="'+l.href+'">'+l.label+'</a></li>';}).join("");
  };

  var cardHTML = function(a){
    var cat = CATS[a.type] || { label:"Info", emoji:"📌", path:"" };
    var tagHTML = a.tag ? '<span class="tag '+(a.tag==="NEW"?"new":"hot")+'">'+esc(a.tag)+'</span>' : "";
    var url = BASE + "/" + cat.path + "/" + a.id + "/";
    if (a.type === "tool") return '<a class="card tool" href="'+url+'"><div class="tool-icon">'+esc(a.icon||"🛠️")+'</div><strong>'+esc(a.title)+'</strong><small>'+esc(a.description||"")+'</small></a>';
    return '<a class="card" href="'+url+'"><div class="card-top"><h3>'+esc(a.title)+'</h3>'+tagHTML+'</div><div class="card-meta"><span>'+cat.emoji+' '+cat.label+'</span><span>'+fmtDate(a.date)+'</span></div><p>'+esc(a.description||"")+'</p><span class="card-link">पूरा पढ़ें →</span></a>';
  };

  var renderHome = function(){
    renderNav("home");
    loadData().then(function(articles){
      var html = '<section class="hero"><div class="container hero-inner"><span class="eyebrow">🇮🇳 Jharkhand + Central Updates</span><h1>Sarkari Jobs, Yojana & <span>News</span> — एक ही जगह</h1><p>सरकारी नौकरी, योजनाएं, जरूरी खबरें और Free Tools — आसान भाषा में।</p><div class="actions"><a class="btn btn-primary" href="'+BASE+'/jobs/">Latest Jobs देखें →</a><a class="btn btn-ghost" href="'+BASE+'/yojana/">Yojana देखें</a></div></div></section>';
      html += '<section class="trust"><div class="container trust-grid"><div class="trust-item"><strong>✓ Source Checked</strong><span>Official sources</span></div><div class="trust-item"><strong>⚡ Easy Info</strong><span>सीधी भाषा</span></div><div class="trust-item"><strong>🆓 Free</strong><span>सभी के लिए</span></div></div></section>';
      ["job","yojana","news","tool"].forEach(function(type){
        var cat = CATS[type];
        var items = sortByDate(articles.filter(function(a){return a.type===type;})).slice(0, HOME_LIMIT[type]);
        if (!items.length) return;
        var alt = (type === "yojana" || type === "tool") ? " alt" : "";
        html += '<section class="section'+alt+'"><div class="container"><div class="section-head"><div><h2 class="section-title">Latest '+cat.label+'</h2><p class="section-sub">'+cat.label+' की ताज़ा जानकारी</p></div><a class="see-all" href="'+BASE+'/'+cat.path+'/">View All →</a></div><div class="grid'+(type==='tool'?' tools':'')+'">'+items.map(cardHTML).join("")+'</div></div></section>';
      });
      if (!articles.length) html += '<section class="section"><div class="container"><p style="text-align:center;color:#666">अभी कोई content नहीं है।</p></div></section>';
      $("#app").innerHTML = html;
      document.title = "Sarkari Info — Jobs, Yojana, News & Tools";
    });
  };

  var renderSection = function(type){
    renderNav(type);
    loadData().then(function(articles){
      var cat = CATS[type]; if (!cat) return renderHome();
      var items = sortByDate(articles.filter(function(a){return a.type===type;}));
      var html = '<section class="section"><div class="container"><div class="breadcrumb"><a href="'+BASE+'/">Home</a> <span>›</span> <span>'+cat.label+'</span></div><div class="section-head"><div><h1 class="section-title">All '+cat.label+'</h1><p class="section-sub">सभी latest '+cat.label+'</p></div></div><div class="grid'+(type==='tool'?' tools':'')+'">'+(items.length ? items.map(cardHTML).join("") : '<div class="empty">कोई content नहीं।</div>')+'</div></div></section>';
      $("#app").innerHTML = html;
      document.title = "All " + cat.label + " — Sarkari Info";
    });
  };

  var renderArticle = function(id){
    renderNav("");
    loadData().then(function(articles){
      var a = articles.filter(function(x){return x.id===id;})[0];
      if (!a) { $("#app").innerHTML = '<section class="section"><div class="container"><div class="article-wrap"><a class="breadcrumb" href="'+BASE+'/">← Home</a><h1 class="article-title">Article Not Found</h1></div></div></section>'; return; }
      var cat = CATS[a.type] || { label:"Info", emoji:"📌", path:"" };
      var fullURL = location.origin + BASE + "/" + cat.path + "/" + a.id + "/";
      var html = '<section class="section"><div class="container"><div class="article-wrap"><div class="breadcrumb"><a href="'+BASE+'/">Home</a> <span>›</span> <a href="'+BASE+'/'+cat.path+'/">'+cat.label+'</a> <span>›</span> <span>'+esc(a.title.length>40?a.title.slice(0,40)+'…':a.title)+'</span></div><h1 class="article-title">'+esc(a.title)+'</h1><div class="article-meta"><span class="cat">'+cat.emoji+' '+cat.label+'</span><span>'+fmtDate(a.date)+'</span></div><div class="article-body" id="articleBody"></div><div class="share-row"><strong>Share:</strong><a class="share-btn wa" href="https://wa.me/?text='+encodeURIComponent(a.title+' — '+fullURL)+'" target="_blank" rel="noopener" aria-label="WhatsApp">WA</a><a class="share-btn tg" href="https://t.me/share/url?url='+encodeURIComponent(fullURL)+'&text='+encodeURIComponent(a.title)+'" target="_blank" rel="noopener" aria-label="Telegram">TG</a><a class="share-btn fb" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(fullURL)+'" target="_blank" rel="noopener" aria-label="Facebook">FB</a><a class="share-btn tw" href="https://twitter.com/intent/tweet?text='+encodeURIComponent(a.title)+'&url='+encodeURIComponent(fullURL)+'" target="_blank" rel="noopener" aria-label="X">X</a><button class="share-btn cp" id="shareCopy" aria-label="Copy">Copy</button></div></div></div></section>';
      $("#app").innerHTML = html;

      /* ✅ Tool scripts execute karo */
      var bodyEl = document.getElementById("articleBody");
      if (bodyEl) {
        if (a.content && a.content.indexOf("<script") !== -1) {
          injectContent(bodyEl, a.content);
        } else {
          bodyEl.innerHTML = a.content || "<p>Content coming soon…</p>";
        }
      }

      document.title = a.title + " — Sarkari Info";
      window.scrollTo(0,0);
    });
  };

  var route = function(){
    var path = location.pathname;
    if (path.indexOf(BASE) === 0) path = path.slice(BASE.length);
    path = path.replace(/^\/+|\/+$/g, "");
    var parts = path ? path.split("/").filter(Boolean) : [];
    if (parts.length === 1 && PATH2TYPE[parts[0]]) return renderSection(PATH2TYPE[parts[0]]);
    if (parts.length === 2 && PATH2TYPE[parts[0]]) return renderArticle(parts[1]);
    return renderHome();
  };

  var initHeader = function(){
    var btn = $("#menuBtn"), nav = $("#primaryNav");
    btn.addEventListener("click", function(){
      var open = !nav.classList.contains("active");
      nav.classList.toggle("active", open);
      document.body.classList.toggle("menu-open", open);
      btn.textContent = open ? "✕" : "☰";
    });
    nav.addEventListener("click", function(e){
      if (e.target.closest(".nav-link") && window.innerWidth <= 1080) { nav.classList.remove("active"); document.body.classList.remove("menu-open"); btn.textContent = "☰"; }
    });
  };

  var initFloating = function(){
    var socials = document.querySelectorAll(".social-float");
    var btt = $("#backToTop");
    var onScroll = function(){
      var y = window.scrollY;
      socials.forEach(function(s){s.classList.toggle("show", y > 280);});
      if (btt) btt.classList.toggle("show", y > 600);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, {passive:true});
    if (btt) btt.addEventListener("click", function(){window.scrollTo({top:0,behavior:"smooth"});});
  };

  document.addEventListener("click", function(e){
    var btn = e.target.closest("#shareCopy");
    if (!btn) return;
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){var o=btn.textContent;btn.textContent="✓";setTimeout(function(){btn.textContent=o;},1500);});
  });

  document.addEventListener("DOMContentLoaded", function(){ initHeader(); initFloating(); route(); window.addEventListener("popstate", route); });
})();
</script>
</body>
</html>
